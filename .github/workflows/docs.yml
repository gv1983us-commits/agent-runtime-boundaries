name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate machine passport
        run: python -m json.tool ARTIFACT.json >/dev/null

      - name: Compile review checks
        run: python -m compileall -q review

      - name: Run publication and canon suite
        run: python -m unittest discover -s review -p "test_*.py" -v

      - name: Check remaining whitespace classes
        run: git -c core.whitespace=-blank-at-eol show --check --oneline HEAD
